<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ອາຫານເຊົ້າພໍ່</title>
<style>
  :root{
    --bg:#fbf7f0; --card:#ffffff; --accent:#e8734a; --text:#2b2b2b; --sub:#8a8378; --ok:#3ba55d;
    --green:#c9ecd2; --green-d:#3ba55d; --orange:#fde3c8; --orange-d:#e8734a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1c1a17; --card:#2a2724; --text:#f3ede6; --sub:#b3a99e; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);font-family:"Noto Sans Lao","Noto Sans",sans-serif;color:var(--text);}
  #app{max-width:800px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 150px;}
  .header{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-wrap:wrap;}
  .header .greet{display:flex;align-items:center;gap:10px;}
  .header .greet .sun{font-size:1.8rem;}
  .header h1{font-size:1.25rem;margin:0;}
  .header .sub{font-size:.72rem;color:var(--sub);margin-top:2px;}
  .header .date{font-size:.75rem;color:var(--sub);text-align:right;}

  .tabs{display:flex;margin:18px 6px -1px;position:relative;z-index:1;}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:16px 16px 0 0;font-weight:700;font-size:.95rem;cursor:pointer;opacity:.6;transform:translateY(4px) scale(.97);transition:all .15s;}
  .tab.breakfast{background:var(--green);color:var(--green-d);}
  .tab.lunch{background:var(--orange);color:var(--orange-d);margin-left:-14px;}
  .tab.active{opacity:1;transform:translateY(0) scale(1);box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:2;}

  .panel{background:var(--card);border-radius:0 16px 16px 16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  h2.section{font-size:1.02rem;margin:4px 4px 10px;color:var(--accent);display:flex;align-items:center;gap:6px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:520px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{position:relative;background:var(--bg);border:3px solid transparent;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .12s, border-color .15s;aspect-ratio:1/1;}
  .tile:active{transform:scale(.94);}
  .tile.chosen{border-color:var(--ok);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .label{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;background:linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));color:#fff;text-align:center;}
  .tile .lo{font-size:.82rem;font-weight:700;line-height:1.15;}
  .tile.emojitile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:3px solid #eee0;}
  .tile.emojitile .emoji{font-size:1.9rem;}
  .tile.emojitile .lo{color:var(--text);font-size:.8rem;}
  .tile.chosen.emojitile{border-color:var(--ok);}
  .tile.surprise{background:linear-gradient(135deg,#7b5cff,#ff6ec7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:4px;}
  .tile.surprise.chosen{border-color:#fff;}
  .tile.other{background:var(--card);border:3px dashed #d8ccbe;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}

  .soon{padding:40px 10px;text-align:center;color:var(--sub);}

  #otherBox{display:none;background:var(--bg);border-radius:14px;padding:12px;margin-top:12px;}
  #otherBox textarea{width:100%;min-height:56px;border-radius:10px;border:1px solid #ddd;padding:9px;font-size:1rem;font-family:inherit;resize:vertical;}
  #otherBox .row{display:flex;gap:8px;margin-top:8px;}
  #otherBox button{flex:1;padding:9px;border:none;border-radius:10px;font-size:.9rem;cursor:pointer;}
  #otherSend{background:var(--accent);color:#fff;}
  #otherCancel{background:#eee;color:#444;}

  #lastSent{background:#eef8f0;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:#2f7a45;display:none;}

  #cart{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));}
  #cart .wrap{max-width:900px;margin:0 auto;background:linear-gradient(180deg,#eef9ef,#e3f5e6);border:1px solid #cdeed3;border-radius:18px;padding:12px 16px;box-shadow:0 -2px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;}
  #cart .head{display:flex;align-items:center;gap:8px;}
  #cart .head .check{font-size:1.1rem;}
  #cart .head .title{font-weight:700;color:#2f7a45;font-size:.95rem;}
  #cart .head .count{background:var(--ok);color:#fff;font-size:.68rem;padding:2px 10px;border-radius:20px;font-weight:700;}
  #cart .row{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;}
  #cartItems{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:150px;}
  .cart-chip{position:relative;flex-shrink:0;width:96px;text-align:center;}
  .cart-chip .thumb{width:96px;height:96px;border-radius:14px;object-fit:cover;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2rem;box-shadow:0 2px 6px rgba(0,0,0,.1);}
  .cart-chip .name{font-size:.72rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444;}
  .cart-chip .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#c0392b;color:#fff;font-size:.8rem;border:none;line-height:24px;cursor:pointer;}
  #noteWrap{flex:1;min-width:160px;display:flex;flex-direction:column;justify-content:center;}
  #noteWrap label{font-size:.68rem;color:#5a8c66;display:flex;align-items:center;gap:4px;margin-bottom:2px;}
  #noteInput{border:1px solid #cdeed3;border-radius:10px;padding:7px 9px;font-size:.82rem;font-family:inherit;resize:none;background:#fff;min-height:36px;}
  #sendBtn{flex-shrink:0;background:var(--ok);color:#fff;border:none;border-radius:14px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-weight:700;font-size:.9rem;}
  #sendBtn .sub{font-weight:400;font-size:.62rem;opacity:.9;}
  #cart.empty #cartItems, #cart.empty #noteWrap{display:none;}
  #cart .emptyMsg{font-size:.85rem;color:var(--sub);text-align:center;padding:4px 0;flex:1;}
  #cart:not(.empty) .emptyMsg{display:none;}
</style>
</head>
<body>
<div id="app">
  <div class="header" id="appHeader">
    <div class="greet"><div class="sun">☀️</div><div><h1>ສະບາຍດີ ພໍ່!</h1><div class="sub">ກະລຸນາເລືອກອາຫານທີ່ຢາກກິນ</div></div></div>
    <div class="date" id="dateText"></div>
  </div>
  <button id="commentBtn" style="display:none;margin:8px 4px 0;background:none;border:1px solid #ddd;border-radius:20px;padding:6px 14px;font-size:.8rem;color:#666;cursor:pointer;">💬 ຄຳຄິດເຫັນ / Comment</button>

  <div class="tabs">
    <div class="tab breakfast active" id="tabBreakfast">🌅 ອາຫານເຊົ້າ</div>
    <div class="tab lunch" id="tabLunch">🍲 ອາຫານທ່ຽງ</div>
  </div>

  <div class="panel" id="panelBreakfast">
    <div id="lastSent"></div>
    <h2 class="section">🍜 ອາຫານ</h2>
    <div class="grid" id="foodGrid"></div>
    <h2 class="section" style="margin-top:20px;">🥤 ເຄື່ອງດື່ມ</h2>
    <div class="grid" id="drinkGrid"></div>
    <div id="otherBox">
      <div style="font-weight:600;margin-bottom:6px;">✍️ ພໍ່ຢາກກິນຫຍັງ?</div>
      <textarea id="otherText" placeholder="ພິມສິ່ງທີ່ຢາກກິນ..."></textarea>
      <div class="row"><button id="otherCancel">ຍົກເລີກ</button><button id="otherSend">ຕໍ່ໄປ</button></div>
    </div>
  </div>

  <div class="panel" id="panelLunch" style="display:none;">
    <div class="soon">🍲 ເມນູອາຫານທ່ຽງກຳລັງຈະມາໄວໆນີ້<br><span style="font-size:.8rem;">ບອກອາຫານທ່ຽງທີ່ພໍ່ມັກ ແລ້ວແອດຈະເພີ່ມໃຫ້</span></div>
  </div>
</div>

<div id="cart" class="empty">
  <div class="wrap">
    <div class="head">
      <span class="check">✅</span>
      <span class="title">ລາຍການທີ່ເລືອກແລ້ວ</span>
      <span class="count" id="cartCount">0</span>
    </div>
    <div class="row">
      <div id="cartItems"></div>
      <div class="emptyMsg" id="emptyMsg">ຍັງບໍ່ທັນເລືອກ — ແຕະຮູບອາຫານທາງເທິງ</div>
      <div id="noteWrap">
        <label>✏️ ຂໍ້ຄວາມເພີ່ມເຕີມ (ຖ້າມີ)</label>
        <textarea id="noteInput" placeholder="ຕົວຢ່າງ: ບໍ່ເອົາຫວານ..."></textarea>
      </div>
      <button id="sendBtn"><span>✔ ຢືນຢັນສັ່ງອາຫານ</span><span class="sub">ເພື່ອໃຫ້ກຽມອາຫານໃຫ້</span></button>
    </div>
  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpQmOrx23ziu2Eij0l_XMdMwQqJdOUZ6D9hP-uh15_XeouYgjOErk-DCCvvxdtuoHW/exec";

  document.getElementById('sendBtn').addEventListener('click', function() {
  let currentCart = cart;
   if (!Array.isArray(currentCart) || currentCart.length === 0) {
    currentCart = [{ lo: "ทดสอบเมนูอาหาร" }]; // ข้อมูลทดสอบเพื่อให้ผ่านเงื่อนไข
  }
  const note = document.getElementById('noteInput').value;
  const activeTabElement = document.querySelector('.tab.active');
  const activeTab = activeTabElement ? activeTabElement.innerText : 'ອາຫານ';

  const itemNamesString = currentCart.map(item => {
    if (!item) return '';
    if (typeof item === 'object') {
      return item.lo || item.name || JSON.stringify(item);
    }
    return String(item);
  filter(Boolean).join(', ');
 // กรองค่าว่างออกแล้วเชื่อมด้วยคอมมา
    
  const payload = {
    type: activeTab,
    items: itemNamesString,
    note: note
  };
  // ส่งข้อมูลไปยัง Google Apps Script
fetch(GOOGLE_SCRIPT_URL, {
  method: 'POST',
  mode: 'no-cors', // บังคับส่งแบบข้าม Origin
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify(payload)
})
.then(() => {
  // เนื่องจากการใช้ no-cors จะอ่านค่ากลับมาตรงๆ ไม่ได้ 
  // ให้แสดงหน้าต่างยืนยันตรงนี้ได้เลยทันทีหลังส่งข้อมูลสำเร็จ
  alert('✅ ຢືນຍັນສັ່ງອາຫານສຳເລັດແລ້ວ! (ส่งออร์เดอร์สำเร็จ)');
   cart = [];
    if (typeof updateCartUI === 'function') updateCartUI();
  })
.catch(error => {
  console.error('Error:', error);
  alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ');
});
});

const ADD_MENU_ITEM = {key:"addmenu", type:"addmenu", lo:"ເພີ່ມເມນູ", en:"Suggest new item", img:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0ODAgNDgwIj4KPHJlY3Qgd2lkdGg9IjQ4MCIgaGVpZ2h0PSI0ODAiIHJ4PSIzMCIgZmlsbD0iI2VlZjdlZSIvPgo8Y2lyY2xlIGN4PSIyNDAiIGN5PSIyMDAiIHI9Ijc1IiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiMzYmE1NWQiIHN0cm9rZS13aWR0aD0iNiIvPgo8bGluZSB4MT0iMjQwIiB5MT0iMTYwIiB4Mj0iMjQwIiB5Mj0iMjQwIiBzdHJva2U9IiMzYmE1NWQiIHN0cm9rZS13aWR0aD0iMTQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgo8bGluZSB4MT0iMjAwIiB5MT0iMjAwIiB4Mj0iMjgwIiB5Mj0iMjAwIiBzdHJva2U9IiMzYmE1NWQiIHN0cm9rZS13aWR0aD0iMTQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgo8L3N2Zz4='};

let db = null;
let selected = new Map(); // id -> {lo, img?, emoji?}

const foodGrid = document.getElementById('foodGrid');
const drinkGrid = document.getElementById('drinkGrid');
const cartEl = document.getElementById('cart');
const cartItemsEl = document.getElementById('cartItems');
const emptyMsg = document.getElementById('emptyMsg');
const otherBox = document.getElementById('otherBox');
const otherText = document.getElementById('otherText');
const lastSentEl = document.getElementById('lastSent');

const LO_DAYS = ["ວັນອາທິດ","ວັນຈັນ","ວັນອັງຄານ","ວັນພຸດ","ວັນພະຫັດ","ວັນສຸກ","ວັນເສົາ"];
const LO_MONTHS = ["ມັງກອນ","ກຸມພາ","ມີນາ","ເມສາ","ພຶດສະພາ","ມິຖຸນາ","ກໍລະກົດ","ສິງຫາ","ກັນຍາ","ຕຸລາ","ພະຈິກ","ທັນວາ"];
function renderDate(){
  const d = new Date();
  document.getElementById('dateText').textContent = LO_DAYS[d.getDay()]+", "+d.getDate()+" "+LO_MONTHS[d.getMonth()]+" "+d.getFullYear();
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "ຫາກໍ່";
  const m = Math.floor(s/60);
  if(m<60) return m+" ນາທີກ່ອນ";
  const h = Math.floor(m/60);
  if(h<24) return h+" ຊົ່ວໂມງກ່ອນ";
  return Math.floor(h/24)+" ມື້ກ່ອນ";
}

function toggleTile(id, data, tileEl){
  if(selected.has(id)){
    selected.delete(id);
    tileEl.classList.remove('chosen');
  }else{
    selected.set(id, data);
    tileEl.classList.add('chosen');
  }
  renderCart();
}

function renderTile(item, type){
  const t = document.createElement('div');
  if(type==='other'){
    t.className = 'tile';
    t.innerHTML = '<img src="'+item.img+'" alt=""><div class="label"><div class="lo">'+item.lo+'</div></div>';
    t.onclick = ()=>{ otherBox.style.display='block'; otherText.value=''; otherText.focus(); };
  }else if(type==='surprise'){
    t.className = 'tile';
    t.innerHTML = '<img src="'+item.img+'" alt=""><div class="label"><div class="lo">'+item.lo+'</div></div>';
    t.onclick = ()=>toggleTile('anything', {lo:item.lo, emoji:'🎁'}, t);
  }else if(type==='addmenu'){
    t.className = 'tile';
    t.innerHTML = '<img src="'+item.img+'" alt=""><div class="label"><div class="lo">'+item.lo+'</div></div>';
    t.onclick = ()=>{
      const val = prompt('ພໍ່ຢາກໃຫ້ເພີ່ມເມນູຫຍັງ?');
      if(val && val.trim()){
        if(db){ try{ db.doc('suggestions/'+Date.now()).set({text:val.trim(), time:Date.now()}); }catch(e){} }
        alert('ຂອບໃຈ! ຈະເພີ່ມເມນູນີ້ໃຫ້ໄວໆນີ້ 🙏');
      }
    };
  }else if(item.emoji){
    t.className = 'tile emojitile';
    t.innerHTML = '<div class="emoji">'+item.emoji+'</div><div class="lo">'+item.lo+'</div>';
    t.onclick = ()=>toggleTile(item.key, {lo:item.lo, emoji:item.emoji}, t);
  }else{
    t.className = 'tile';
    t.innerHTML = '<img src="'+item.img+'" alt=""><div class="label"><div class="lo">'+item.lo+'</div></div>';
    t.onclick = ()=>toggleTile(item.key, {lo:item.lo, img:item.img}, t);
  }
  return t;
}

function fixSquares(){
  try{
    if(window.CSS && CSS.supports && CSS.supports('aspect-ratio','1 / 1')) return;
  }catch(e){}
  document.querySelectorAll('.tile').forEach(function(t){
    var w = t.offsetWidth;
    if(w>0) t.style.height = w+'px';
  });
}
window.addEventListener('resize', fixSquares);
window.addEventListener('load', fixSquares);

function renderGrids(){
  foodGrid.innerHTML=''; FOOD_ITEMS.forEach(it=>foodGrid.appendChild(renderTile(it,'food')));
  SPECIAL_ITEMS.forEach(it=>foodGrid.appendChild(renderTile(it, it.type)));
  foodGrid.appendChild(renderTile(ADD_MENU_ITEM, 'addmenu'));
  drinkGrid.innerHTML=''; DRINK_ITEMS.forEach(it=>drinkGrid.appendChild(renderTile(it,'food')));
  SPECIAL_ITEMS.forEach(it=>drinkGrid.appendChild(renderTile(it, it.type)));
  drinkGrid.appendChild(renderTile(ADD_MENU_ITEM, 'addmenu'));
  fixSquares();
}

function renderCart(){
  cartItemsEl.innerHTML = '';
  const cartCount = document.getElementById('cartCount');
  cartCount.textContent = selected.size;
  if(selected.size===0){
    cartEl.classList.add('empty');
    return;
  }
  cartEl.classList.remove('empty');
  selected.forEach((data,id)=>{
    const chip = document.createElement('div');
    chip.className='cart-chip';
    const thumb = data.img ? '<img class="thumb" src="'+data.img+'">' : '<div class="thumb">'+data.emoji+'</div>';
    chip.innerHTML = thumb+'<div class="name">'+data.lo+'</div><button class="x">✖</button>';
    chip.querySelector('.x').onclick = ()=>{
      selected.delete(id);
      renderGrids(); // rebuild to clear chosen border cleanly
      renderCart();
    };
    cartItemsEl.appendChild(chip);
  });
}

document.getElementById('sendBtn').onclick = async ()=>{
  if(selected.size===0) return;
  const items = Array.from(selected.values());
  const note = document.getElementById('noteInput').value.trim();
  const order = {items, note, time: Date.now()};
  if(db){ try{ await db.doc('order/current').set(order); }catch(e){} }
  showLastSent(order);
  selected.clear();
  document.getElementById('noteInput').value='';
  renderGrids();
  renderCart();
};

function fmtStamp(ts){
  var d = new Date(ts);
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  return d.getDate()+' '+LO_MONTHS[d.getMonth()]+' '+d.getFullYear()+' '+hh+':'+mm;
}

function showLastSent(order){
  lastSentEl.style.display='block';
  const names = order.items.map(i=>i.lo).join(', ');
  const noteHtml = order.note ? ' — 📝 '+order.note : '';
  lastSentEl.innerHTML = '✅ ສົ່ງແລ້ວ: <b>'+names+'</b>'+noteHtml+' <span style="color:#888;">('+fmtStamp(order.time)+' · '+timeAgo(order.time)+')</span>';
}

document.getElementById('otherCancel').onclick = ()=>{ otherBox.style.display='none'; };
document.getElementById('otherSend').onclick = ()=>{
  const val = otherText.value.trim();
  if(!val) return;
  otherBox.style.display='none';
  selected.set('other-'+Date.now(), {lo:val, emoji:'✍️'});
  renderCart();
};

document.getElementById('tabBreakfast').onclick = ()=>{
  document.getElementById('tabBreakfast').classList.add('active');
  document.getElementById('tabLunch').classList.remove('active');
  document.getElementById('panelBreakfast').style.display='block';
  document.getElementById('panelLunch').style.display='none';
};
document.getElementById('tabLunch').onclick = ()=>{
  document.getElementById('tabLunch').classList.add('active');
  document.getElementById('tabBreakfast').classList.remove('active');
  document.getElementById('panelLunch').style.display='block';
  document.getElementById('panelBreakfast').style.display='none';
};

async function init(){
  renderDate();
  renderGrids();
  renderCart();
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  if(db){
    try{
      db.doc('order/current').onSnapshot(snap=>{
        const data = snap && snap.data ? snap.data() : null;
        if(data && data.items){ showLastSent(data); }
      });
    }catch(e){}
  }
  try{
    const comments = await claude.use('comments');
    if(comments){
      const btn = document.getElementById('commentBtn');
      btn.style.display = 'inline-block';
      btn.onclick = ()=>{
        comments.openComposer({element: document.getElementById('appHeader')});
      };
    }
  }catch(e){}
}
init();
</script>
</body>
